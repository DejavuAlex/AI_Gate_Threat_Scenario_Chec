services:
  ai-security-gate:
    build: .
    ports:
      # Main UI/API port. Override by setting AI_SECURITY_GATE_HOST_PORT.
      - "${AI_SECURITY_GATE_HOST_PORT:-18080}:8000"
      # API documentation service: http://localhost:18081/docs by default.
      - "${AI_SECURITY_GATE_DOCS_PORT:-18081}:8000"
    volumes:
      - ./reports:/app/reports
      - ./data:/app/data
      - ./knowledge_base:/app/knowledge_base
      - ./specs:/app/specs
    environment:
      PYTHONUNBUFFERED: "1"
      AI_SECURITY_GATE_API_KEY: "${AI_SECURITY_GATE_API_KEY:-}"
      AI_LLM_ENABLED: "${AI_LLM_ENABLED:-false}"
      AI_PROVIDER: "${AI_PROVIDER:-openai}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5-2025-08-07}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://eu.aigw.galileo.roche.com/v1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      LLM_MATCHING_TEMPERATURE: "${LLM_MATCHING_TEMPERATURE:-0}"
      LLM_MATCHING_TIMEOUT_SECONDS: "${LLM_MATCHING_TIMEOUT_SECONDS:-60}"
